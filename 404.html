<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Abdulrhman Yaghi</title>
    <meta
      name="description"
      content="This page does not exist. Go back to the portfolio of Abdulrhman Yaghi, backend developer in Amman, Jordan."
    />
    <!-- Error pages are not indexed, so they get no canonical link. -->
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/monogram.svg" />
    <meta name="theme-color" content="#0B1220" />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="/src/not-found.css" />
  </head>
  <body>
    <header class="nf-header">
      <a class="nf-brand" href="/">
        <img src="/monogram.svg" alt="" width="36" height="36" />
        <span>Abdulrhman Yaghi</span>
      </a>
    </header>
    <main class="nf-main">
      <p class="nf-code">
        <span class="nf-dot"></span>Error 404 · Page not found
      </p>
      <h1>This page doesn’t exist<span class="nf-accent">.</span></h1>
      <p class="nf-text">
        The link may be broken, or the page may have moved. Everything on this
        site lives on the home page.
      </p>
      <div class="nf-actions">
        <a class="nf-button" href="/"
          >Go to the home page <span aria-hidden="true">→</span></a
        >
        <a class="nf-link" href="/#contact"
          >Report a broken link <span aria-hidden="true">→</span></a
        >
      </div>
    </main>
  </body>
</html>
